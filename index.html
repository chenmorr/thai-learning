<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>תאית — חן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b;
    --line:#2a2f3a; --text:#e8eaed; --muted:#9aa2b1;
    --accent:#5eead4; --accent-dim:#0d9488; --warn:#fbbf24;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fbfbfd; --surface:#fff; --surface-2:#f2f4f8;
      --line:#e2e6ee; --text:#14161b; --muted:#5f6875;
      --accent:#0d9488; --accent-dim:#0d9488; --warn:#b45309; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Heebo',system-ui,-apple-system,sans-serif;
    font-size:17px; line-height:1.7;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em}
  .brand span{font-size:13px;color:var(--muted);font-weight:400}
  nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto; font-family:inherit; font-size:14px; font-weight:600;
    padding:8px 15px; border-radius:999px; cursor:pointer;
    background:var(--surface-2); color:var(--muted);
    border:1px solid var(--line); transition:.15s;
  }
  nav button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  main{padding:22px 14px 80px; max-width:820px; margin:0 auto}
  #doc>*:first-child{margin-top:0}
  h1,h2,h3{line-height:1.35;letter-spacing:-.02em}
  h1{font-size:26px;font-weight:800;margin:0 0 18px}
  h2{
    font-size:20px;font-weight:800;margin:38px 0 14px;
    padding-top:18px;border-top:1px solid var(--line);
  }
  h3{font-size:16px;font-weight:600;margin:26px 0 10px;color:var(--accent)}
  p{margin:0 0 14px}
  strong{font-weight:600;color:var(--text)}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  ul,ol{margin:0 0 16px;padding-inline-start:22px}
  li{margin-bottom:7px}
  blockquote{margin:0 0 16px;padding:12px 16px;background:var(--surface);border-radius:12px;
    border-inline-start:3px solid var(--accent)}
  code{
    font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:.9em;
    background:var(--surface-2); padding:2px 6px; border-radius:6px;
    unicode-bidi:plaintext; color:var(--accent);
  }
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 20px;
    border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{
    padding:11px 13px; text-align:start; vertical-align:top;
    border-bottom:1px solid var(--line); unicode-bidi:plaintext;
  }
  th{background:var(--surface-2);font-weight:600;font-size:13px;
    color:var(--muted);letter-spacing:.03em;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  /* כתב תאי גדול וקריא */
  td:has(> :is(.thai)), .thai{font-family:'Noto Sans Thai',sans-serif}
  table td{font-family:'Heebo','Noto Sans Thai',sans-serif}
  table td:nth-child(1){font-size:19px}
  .loading{color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>תאית</h1><span>ภาษากลาง · קלאנג</span></div>
  <nav id="nav"></nav>
</header>
<main><div id="doc" class="loading">טוען…</div></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const nav = document.getElementById('nav');
const doc = document.getElementById('doc');
let files = [];

function wrapTables(){
  doc.querySelectorAll('table').forEach(t=>{
    if(t.parentElement.classList.contains('tw')) return;
    const w=document.createElement('div'); w.className='tw';
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
}

async function load(f, btn){
  doc.className='loading'; doc.textContent='טוען…';
  [...nav.children].forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  try{
    const r = await fetch(f.file + '?v=' + Date.now());
    if(!r.ok) throw 0;
    doc.className=''; doc.innerHTML = marked.parse(await r.text());
    wrapTables();
    doc.querySelectorAll('a[href$=".md"]').forEach(a=>{
      a.addEventListener('click', e=>{
        const t=[...nav.children].find(b=>b.dataset.file===a.getAttribute('href'));
        if(t){ e.preventDefault(); t.click(); }
      });
    });
    window.scrollTo({top:0});
    location.hash = encodeURIComponent(f.file);
  }catch(e){
    doc.className=''; doc.innerHTML='<p>לא הצלחתי לטעון את הקובץ.</p>';
  }
}

(async ()=>{
  files = await (await fetch('files.json?v='+Date.now())).json();
  files.forEach((f,i)=>{
    const b=document.createElement('button');
    b.textContent=f.title; b.dataset.file=f.file;
    b.onclick=()=>load(f,b);
    nav.appendChild(b);
  });
  const want = decodeURIComponent(location.hash.slice(1));
  const idx = Math.max(0, files.findIndex(f=>f.file===want));
  nav.children[idx].click();
})();
</script>
</body>
</html>
